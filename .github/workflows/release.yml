name: Signed APK Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3.2.2
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4.4.1

      - name: Test and build the release APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease

      - name: Sign and verify the release APK
        env:
          APPLOCK_KEYSTORE_BASE64: ${{ secrets.APPLOCK_KEYSTORE_BASE64 }}
          APPLOCK_KEYSTORE_PASSWORD: ${{ secrets.APPLOCK_KEYSTORE_PASSWORD }}
        run: |
          : "${APPLOCK_KEYSTORE_BASE64:?Missing signing keystore}"
          : "${APPLOCK_KEYSTORE_PASSWORD:?Missing signing password}"
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          tools="$ANDROID_HOME/build-tools/37.0.0"
          version=$("$tools/aapt" dump badging "$apk" | sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p")
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match APK version $version"
            exit 1
          fi
          keystore=$(mktemp)
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$APPLOCK_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          "$tools/apksigner" sign --ks "$keystore" --ks-type PKCS12 \
            --ks-key-alias applock --ks-pass env:APPLOCK_KEYSTORE_PASSWORD \
            --out "AppLock-$GITHUB_REF_NAME.apk" "$apk"
          "$tools/apksigner" verify --print-certs "AppLock-$GITHUB_REF_NAME.apk"

      - name: Publish the signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "AppLock-$GITHUB_REF_NAME.apk" \
            --verify-tag --title "AppLock $GITHUB_REF_NAME" --generate-notes \
            --notes "APK signed with the fork's release key. Switching from a build signed with another key requires uninstalling it, which clears its local app settings." \
            "${flags[@]}"
